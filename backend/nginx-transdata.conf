# ====================================================================
# Transdata NMS - Nginx Production Virtual Host Configuration
# Place in: /etc/nginx/sites-available/transdata-nms
# Link to:  /etc/nginx/sites-enabled/transdata-nms
# ====================================================================

server {
    listen 80;
    server_name nms.transdata.net.id; # Ganti dengan domain atau IP server Anda

    root /var/www/transdata-nms/dist; # Direktori build statis React SPA
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Backend PHP REST API routing
    # Gunakan prefix matching (^~ /api) agar SELURUH request /api/* (GET, POST, PUT, DELETE, OPTIONS)
    # selalu dieksekusi langsung oleh PHP-FPM dan TIDAK PERNAH jatuh ke static file fallback (menghindari HTTP 405).
    location ^~ /api {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Sesuaikan jika menggunakan php8.2-fpm.sock
        fastcgi_index index.php;
        fastcgi_split_path_info ^(/api)(/.*)$;
        fastcgi_param SCRIPT_FILENAME /var/www/transdata-nms/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # 2. Frontend React Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Proteksi file konfigurasi dan source backend agar tidak dapat diakses publik
    location ~ /\.(ht|git|env) {
        deny all;
    }

    location ~ ^/(backend|database|node_modules|\.git) {
        deny all;
    }

    # 4. Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
